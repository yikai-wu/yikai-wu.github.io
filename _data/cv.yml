# Website CV: full academic CV (June 2026), with current research/status from October 2026.
# The downloadable PDF remains the user-selected full academic CV.
cv:
  name: Yikai Wu
  label: Ph.D. Candidate in Computer Science
  email: yikai.wu@cs.princeton.edu
  location: Princeton, NJ, USA
  website: https://yikai-wu.github.io/
  summary: >
    Ph.D. candidate at Princeton University, advised by Prof. Sanjeev Arora.
    Research focuses on mathematical reasoning in large language models, synthetic data,
    gradient-based skill representations, and continual learning, with earlier work in
    combinatorial optimization and differential privacy.

  sections:
    Education:
      - institution: Princeton University
        location: Princeton, NJ, USA
        area: Computer Science
        studyType: Ph.D. candidate
        start_date: 2022
        end_date: present
        highlights:
          - "Advisor: Prof. Sanjeev Arora"

      - institution: Yale University
        location: New Haven, CT, USA
        area: Computer Science
        studyType: Ph.D. studies
        start_date: 2021
        end_date: 2022

      - institution: Duke University
        location: Durham, NC, USA
        area: Computer Science and Mathematics; minor in Physics
        studyType: B.S., summa cum laude
        start_date: 2017
        end_date: 2021
        highlights:
          - "GPA: 3.97/4.00"
          - Phi Beta Kappa

    Experience:
      - company: Princeton University
        position: Synthetic Math Data Generation
        start_date: 2026-02
        end_date: present
        summary: "Advisor: Prof. Sanjeev Arora"
        highlights:
          - Develop pipelines to generate, solve, check, and refine difficult math questions with controlled skill combinations.
          - Annotate mathematical skills and filter questions using answer consistency across teacher models.

      - company: Princeton University
        position: Gradient Skill Decomposition for Continual Learning
        start_date: 2025-11
        end_date: present
        summary: "Advisor: Prof. Sanjeev Arora"
        highlights:
          - Combine layer-wise factor estimation and supervised skill recovery to extract interpretable skill vectors from per-example LoRA-B gradients.
          - Use recovered skill vectors to project fine-tuning gradients away from protected skill subspaces and reduce forgetting.

      - company: Princeton University
        position: Skill-Based Training for Mathematical Reasoning
        start_date: 2025-10
        end_date: 2026-02
        summary: "Advisor: Prof. Sanjeev Arora"
        highlights:
          - Use stronger language models to diagnose missing mathematical skills and construct targeted training data.
          - Study skill-targeted supervised fine-tuning and reinforcement learning; targeted RL did not consistently outperform standard RL.

      - company: Princeton University
        position: Language-Model Agents for Numerical Program Optimization
        start_date: 2025-04
        end_date: 2025-10
        summary: "Mentor: Dr. Ofir Press"
        highlights:
          - Contributed to AlgoTune, a benchmark for numerical programming with correctness checks and runtime comparisons against reference implementations.
          - Evaluated AlgoTuner, an agent that edits, compiles, profiles, verifies, and selects optimized code.
          - Published at NeurIPS 2025, Datasets and Benchmarks Track.

      - company: Princeton University
        position: Step-by-Step Chain-of-Thought Reasoning Analysis
        start_date: 2025-02
        end_date: 2025-10
        summary: "Advisor: Prof. Sanjeev Arora"
        highlights:
          - Studied reasoning decomposed into iterative steps across multiple forward passes to investigate reliance on memorized patterns.
          - Analyzed reasoning robustness and failure modes including context loss, step fragmentation, and premature termination.

      - company: Princeton University
        position: Benchmarking AI for Combinatorial Optimization
        start_date: 2023-10
        end_date: 2025-01
        summary: "Advisor: Prof. Sanjeev Arora"
        highlights:
          - Benchmarked generative and reinforcement learning methods for Maximum Independent Set against strong classical solvers.
          - Introduced serialization analysis to explain similarities between non-backtracking AI methods and greedy heuristics.
          - Published in Transactions on Machine Learning Research, April 2026.

      - company: Yale University
        position: Differentially Private Optimization on Unitary Orbits
        start_date: 2021-06
        end_date: 2022-02
        summary: "Mentor: Prof. Nisheeth Vishnoi"
        highlights:
          - Designed efficient differentially private optimization algorithms on unitary orbits, with applications to PCA and rank-k matrix approximation.
          - Established upper and lower utility bounds; published at COLT 2022.

      - company: Duke University
        position: Hessian Structure in Neural Networks
        start_date: 2020-05
        end_date: 2021-08
        summary: "Mentor: Prof. Rong Ge"
        highlights:
          - Explained common neural-network Hessian structures using Kronecker factorization, with applications to PAC-Bayes generalization bounds.

      - company: Duke University
        position: Differential Privacy for Multiple Analysts
        start_date: 2020-01
        end_date: 2021-05
        summary: "Mentor: Prof. Ashwin Machanavajjhala"
        highlights:
          - Formulated criteria for differential privacy with multiple analysts and designed algorithms with provable guarantees.
          - Published at VLDB 2021, following a preliminary version at TPDP 2020.

      - company: Duke University
        position: Quantum Information and Algorithms
        start_date: 2019-05
        end_date: 2020-05
        summary: "Mentor: Prof. Iman Marvian"
        highlights:
          - Investigated operators for ion-trap quantum computers and designed algorithms for quantum-state purification.

      - company: Duke University
        position: Differential Privacy for Summation Queries
        start_date: 2018-05
        end_date: 2019-11
        summary: "Mentor: Prof. Ashwin Machanavajjhala"
        highlights:
          - Developed a data-dependent truncation algorithm for answering numerical summation queries under differential privacy.
          - Presented at TPDP 2019.

